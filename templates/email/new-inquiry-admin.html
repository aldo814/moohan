<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>새 문의 접수 안내</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f3f3; font-family:Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color:#333333;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin:0; padding:0; border-collapse:collapse; background-color:#f3f3f3;">
    <tr><td align="center" style="padding:0;">
      <table role="presentation" width="680" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:680px; border-collapse:collapse; background-color:#ffffff;">
        <tr><td height="76" valign="top" background="https://mthome.hankyeul.com/images/email/admin_top.png" style="height:76px; padding:0 40px; background-color:#f98d1e; background-image:url('https://mthome.hankyeul.com/images/email/admin_top.png'); background-position:center top; background-repeat:no-repeat; background-size:680px 120px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;"><tr><td height="76" valign="middle" style="height:76px; padding:0;">
            <img src="https://mthome.hankyeul.com/images/email/logo-admin.svg" width="134" height="28" alt="무한기술번역" style="display:block; width:134px; height:28px; margin:0; padding:0; border:0; outline:none; text-decoration:none;">
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:0; background-color:#ffffff; border-radius:32px 32px 0 0;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
            <tr><td style="padding:60px 40px 80px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                <tr><td style="padding:0; font-size:28px; line-height:40px; font-weight:500; color:#000000; word-break:keep-all;">새로운 문의가 접수되었습니다.</td></tr>
                <tr><td height="40" style="height:40px; padding:0; font-size:0; line-height:0;">&nbsp;</td></tr>
                <tr><td style="padding:0; border-top:2px solid #000000;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse; table-layout:fixed;">
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">성함</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-word;">{{name}}</td>
                    </tr>
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">회사명</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-word;">{{company}}</td>
                    </tr>
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">이메일</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-all;">{{email}}</td>
                    </tr>
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">연락처</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-word;">{{phone}}</td>
                    </tr>
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">문의 내용</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-word;">{{inquiry}}</td>
                    </tr>
                    <tr>
                      <td width="148" valign="middle" style="width:148px; padding:20px; background-color:#f9f9f9; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:500; color:#000000;">첨부 파일</td>
                      <td valign="middle" style="padding:12px 20px; border-bottom:1px solid #eaeaea; font-size:16px; line-height:24px; font-weight:400; color:#666666; word-break:break-all;">{{attachment}}</td>
                    </tr>
                  </table>
                </td></tr>
              </table>
            </td></tr>
            <tr><td style="padding:32px 40px; background-color:#f9f9f9; border-top:1px solid #eaeaea;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                <tr><td style="padding:0; font-size:12px; line-height:16px; font-weight:400; color:#959595;">&copy;2026 MOOHAN Technical Translation Services Co., Ltd.</td></tr>
              </table>
            </td></tr>
          </table>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
